# ─────────────────────────────────────────────────────────────────────
# CoRoute — stack full-stack (backend + frontend + MongoDB)
# Démarrage :        docker compose up -d
# Avec outils dev :  docker compose --profile dev-tools up -d
# Les valeurs sensibles proviennent du fichier .env (voir .env.example).
# ─────────────────────────────────────────────────────────────────────

services:
  mongo:
    image: mongo:7.0
    container_name: coroute-mongo
    restart: unless-stopped
    # Pas de port publié par défaut : MongoDB reste sur le réseau interne.
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-coroute}
    volumes:
      - mongo-data:/data/db
    networks:
      - coroute-network
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mongosh --quiet -u "$$MONGO_INITDB_ROOT_USERNAME" -p "$$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand(''ping'').ok" | grep -q 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
    image: coroute-backend:latest
    container_name: coroute-backend
    restart: unless-stopped
    ports:
      - '8080:8080'
    environment:
      MONGO_URI: ${MONGO_URI:-mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin}
      MONGO_DB: ${MONGO_DB:-coroute}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_SECONDS: ${JWT_EXPIRATION_SECONDS:-86400}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - coroute-network
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:8080/trajets']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      target: production
    image: coroute-frontend:latest
    container_name: coroute-frontend
    restart: unless-stopped
    ports:
      - '80:80'
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coroute-network
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost:80/']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Console d'administration Mongo — profil de développement uniquement.
  mongo-express:
    image: mongo-express:1.0.2
    container_name: coroute-mongo-express
    restart: unless-stopped
    profiles:
      - dev-tools
    ports:
      - '8081:8081'
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD}
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      # Authentification obligatoire de la console (jamais admin/password).
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_CONFIG_BASICAUTH_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_CONFIG_BASICAUTH_PASSWORD}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - coroute-network

networks:
  coroute-network:
    driver: bridge

volumes:
  mongo-data:
