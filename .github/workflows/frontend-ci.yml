name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

defaults:
  run:
    working-directory: frontend

jobs:
  build:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier (vérification)
        run: npm run format:check

      - name: Vérification TypeScript
        run: npm run type-check

      - name: Tests avec couverture
        run: npm run test:coverage

      - name: Build de production
        run: npm run build

      - name: Upload du build
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-dist
          path: frontend/dist/

  audit:
    name: Audit de sécurité npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installation des dépendances
        run: npm ci

      # Échoue réellement sur les vulnérabilités high/critical (pas de continue-on-error).
      - name: npm audit (high/critical)
        run: npm audit --audit-level=high

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build de l'image frontend (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          target: production
          push: false
          tags: coroute-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
