name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build, qualité et tests
    runs-on: ubuntu-latest
    env:
      # Secrets non sécurisés, réservés à l'exécution des tests en CI.
      JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      JWT_EXPIRATION_SECONDS: '86400'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Compilation
        run: mvn -B compile

      - name: Vérification du format (google-java-format)
        run: mvn -B com.spotify.fmt:fmt-maven-plugin:check

      - name: Checkstyle
        run: mvn -B checkstyle:check

      - name: PMD
        run: mvn -B pmd:check

      - name: SpotBugs
        run: mvn -B spotbugs:check

      - name: Tests unitaires
        run: mvn -B test -Dtest='*Test'

      - name: Tests d'intégration
        run: mvn -B test -Dtest='*IT'

      - name: Tests Testcontainers (MongoDB)
        run: mvn -B test -Dtest='InMongo*'

      - name: Couverture JaCoCo
        run: mvn -B jacoco:report

      - name: Package (JAR exécutable)
        run: mvn -B package -DskipTests

      - name: Upload rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache de la base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: Analyse des dépendances (échoue si CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image backend (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: coroute-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
