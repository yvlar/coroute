name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'

defaults:
  run:
    working-directory: backend

jobs:
  build:
    name: Build, qualité et tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      JWT_SECRET: ci-only-jwt-secret-not-for-production-000000
      JWT_EXPIRATION_SECONDS: '86400'
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Vérification du format (google-java-format)
        run: mvn -B com.spotify.fmt:fmt-maven-plugin:check

      - name: Build, analyse statique, tests et couverture
        run: mvn -B clean verify

      - name: Upload des rapports de tests
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload du rapport de couverture
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

      - name: Upload des rapports d'analyse statique
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-static-analysis
          path: |
            backend/target/pmd.xml
            backend/target/spotbugsXml.xml
            backend/target/checkstyle-result.xml
          if-no-files-found: ignore

  owasp:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache de la base NVD
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: dependency-check-${{ runner.os }}

      - name: Analyse des dépendances (échoue si CVSS >= 7)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: mvn -B dependency-check:check

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image backend (sans publication)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: coroute-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
